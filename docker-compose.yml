version: '3.8'

services:
  sglang:
    image: lmsysorg/sglang:dev
    container_name: sglang_server
    command: >
      python -m sglang.launch_server
      --model /local/mistral-7b
      --context-length 32000
      --tp 1
      --quantization fp8
      --attention-backend triton
      --host 0.0.0.0
      --port 30000
    volumes:
      - ./models/mistral-7b:/local/mistral-7b:ro
    shm_size: 32g
    ipc: host
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true

  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - DEBUG=1
    volumes:
      - localstack_data:/tmp/localstack
    restart: unless-stopped

volumes:
  sqlite-data:
  localstack_data:
