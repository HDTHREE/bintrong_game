services:
  postgres:
    image: postgres:16-alpine
    container_name: livetrivia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: livetrivia
      POSTGRES_PASSWORD: livetrivia
      POSTGRES_DB: livetrivia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livetrivia"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - livetrivia_net

  # Note this is a build only container to ensure that the tag exists for the API.
  game:
    build:
      context: .
      dockerfile: game.Dockerfile
      target: runtime
    image: livetrivia-game:latest
    container_name: dummy
    command: echo 'Game build success'

  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    image: livetrivia-api:latest
    container_name: livetrivia_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      sglang:
        condition: service_started
      game:
        condition: service_completed_successfully
    environment:
      SQL_URL: postgresql+asyncpg://livetrivia:livetrivia@postgres:5432/livetrivia
      SECRET_KEY: changeme_in_production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      SGLANG_URL: http://sglang:30000/
      S3_URL: http://unused/
      S3_REGION: us-east-1
      BUCKET_NAME: unused
      DOCKER_NETWORK: livetrivia_net
      GAME_IMAGE: livetrivia-game:latest
      NGINX_CONTAINER_NAME: livetrivia_nginx
      NGINX_CONF_PATH: /nginx_conf
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-bintrong_game}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - nginx_config:/nginx_conf
    networks:
      - livetrivia_net

  sglang:
    image: lmsysorg/sglang:dev
    container_name: livetrivia_sglang
    restart: unless-stopped
    command: >
      python -m sglang.launch_server
      --model /local/mistral-7b
      --context-length 32000
      --tp 1
      --quantization fp8
      --kv-cache-dtype fp8_e5m2
      --attention-backend triton
      --chunked-prefill-size 4096
      --mem-fraction-static 0.8
      --enable-torch-compile
      --host 0.0.0.0
      --port 30000
    volumes:
      - ./models/mistral-7b:/local/mistral-7b:ro
    shm_size: 32g
    ipc: host
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    networks:
      - livetrivia_net

  app:
    build:
      context: .
      dockerfile: app.Dockerfile
    image: livetrivia-app:latest
    container_name: livetrivia_app
    restart: unless-stopped
    depends_on:
      - api
    environment:
      BACKEND_URL: http://api:8000/
    networks:
      - livetrivia_net

  nginx:
    image: nginx:alpine
    container_name: livetrivia_nginx
    restart: unless-stopped
    depends_on:
      - app
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_config:/etc/nginx/conf.d/games
    networks:
      - livetrivia_net

networks:
  livetrivia_net:
    name: livetrivia_net

volumes:
  postgres_data:
  nginx_config:
