services:
  postgres:
    image: postgres:16-alpine
    container_name: livetrivia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: livetrivia
      POSTGRES_PASSWORD: livetrivia
      POSTGRES_DB: livetrivia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livetrivia"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    container_name: livetrivia_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      sglang:
        condition: service_started
    environment:
      SQL_URL: postgresql+asyncpg://livetrivia:livetrivia@postgres:5432/livetrivia
      SECRET_KEY: changeme_in_production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      SGLANG_URL: http://sglang:30000/
      # S3 vars are required by getenvs at import time; storage auto-uses postgres when SQL_URL contains "postgresql"
      S3_URL: http://unused/
      S3_REGION: us-east-1
      BUCKET_NAME: unused
    ports:
      - "8000:8000"

  sglang:
    image: lmsysorg/sglang:dev
    container_name: livetrivia_sglang
    restart: unless-stopped
    command: >
      python -m sglang.launch_server
      --model /local/mistral-7b
      --context-length 32000
      --tp 1
      --quantization fp8
      --kv-cache-dtype fp8_e5m2
      --attention-backend triton
      --chunked-prefill-size 4096
      --mem-fraction-static 0.8
      --enable-torch-compile
      --host 0.0.0.0
      --port 30000
    volumes:
      - ./models/mistral-7b:/local/mistral-7b:ro
    shm_size: 32g
    ipc: host
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true

  app:
    build:
      context: .
      dockerfile: app.Dockerfile
    container_name: livetrivia_app
    restart: unless-stopped
    depends_on:
      - api
    environment:
      BACKEND_URL: http://api:8000/
    ports:
      - "7777:7777"

volumes:
  postgres_data:
