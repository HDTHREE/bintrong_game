# ============================================================================
# LiveTrivia Helm values
# ============================================================================

# -- Global settings ---------------------------------------------------------
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Cluster DNS resolver IP (kube-dns / CoreDNS ClusterIP) ------------------
# Used by nginx for runtime DNS resolution of game-server upstreams.
# Default works for standard kubeadm / kind / Docker Desktop clusters.
dnsResolverIP: "10.96.0.10"

# -- Secrets (override in a sealed-secret or --set at install time) ----------
secrets:
  postgresPassword: livetrivia
  secretKey: changeme_in_production

# -- RBAC for the API pod (manages game-server Pods/Services/ConfigMaps) -----
rbac:
  create: true

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# ============================================================================
# Per-service configuration
# ============================================================================

# -- API (FastAPI) -----------------------------------------------------------
api:
  image:
    repository: livetrivia-api
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources: {}
  env:
    ALGORITHM: HS256
    ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    REFRESH_TOKEN_EXPIRE_DAYS: "7"
    DEPLOYMENT_MODE: kubernetes

# -- App (Dash frontend) ----------------------------------------------------
app:
  image:
    repository: livetrivia-app
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources: {}

# -- nginx (reverse proxy) --------------------------------------------------
nginx:
  image:
    repository: nginx
    tag: alpine
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: LoadBalancer
    port: 80
  resources: {}

# -- PostgreSQL --------------------------------------------------------------
postgres:
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  storage: 5Gi
  resources: {}

# -- SGLang (LLM inference) -------------------------------------------------
sglang:
  enabled: true
  image:
    repository: lmsysorg/sglang
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    limits:
      nvidia.com/gpu: "1"
  model:
    # PVC name that contains the model weights at /models/mistral-7b
    existingClaim: ""
    # If empty, an emptyDir is used (you must pre-populate the volume yourself)
  args:
    - python
    - -m
    - sglang.launch_server
    - --model
    - /models/mistral-7b
    - --context-length
    - "32000"
    - --tp
    - "1"
    - --quantization
    - fp8
    - --kv-cache-dtype
    - fp8_e5m2
    - --attention-backend
    - triton
    - --chunked-prefill-size
    - "4096"
    - --mem-fraction-static
    - "0.8"
    - --enable-torch-compile
    - --host
    - 0.0.0.0
    - --port
    - "30000"

# -- Game server (dynamically spawned pods) ----------------------------------
gameServer:
  image:
    repository: livetrivia-game
    tag: latest
    pullPolicy: IfNotPresent
