apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lt.fullname" . }}-secret
  labels:
    {{- include "lt.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  SQL_URL: "postgresql+asyncpg://livetrivia:{{ .Values.secrets.postgresPassword }}@{{ include "lt.fullname" . }}-postgres:5432/livetrivia"
