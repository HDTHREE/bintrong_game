apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lt.fullname" . }}-api
  labels:
    {{- include "lt.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "lt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "lt.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "lt.serviceAccountName" . }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "lt.fullname" . }}-postgres 5432; do
                echo "Waiting for postgres..."
                sleep 2
              done
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SQL_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "lt.fullname" . }}-secret
                  key: SQL_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lt.fullname" . }}-secret
                  key: SECRET_KEY
            - name: ALGORITHM
              value: {{ .Values.api.env.ALGORITHM | quote }}
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: {{ .Values.api.env.ACCESS_TOKEN_EXPIRE_MINUTES | quote }}
            - name: REFRESH_TOKEN_EXPIRE_DAYS
              value: {{ .Values.api.env.REFRESH_TOKEN_EXPIRE_DAYS | quote }}
            - name: DEPLOYMENT_MODE
              value: {{ .Values.api.env.DEPLOYMENT_MODE | quote }}
            - name: SGLANG_URL
              value: "http://{{ include "lt.fullname" . }}-sglang:30000/"
            - name: S3_URL
              value: "http://unused/"
            - name: S3_REGION
              value: "us-east-1"
            - name: BUCKET_NAME
              value: "unused"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GAME_IMAGE
              value: "{{ .Values.gameServer.image.repository }}:{{ .Values.gameServer.image.tag }}"
            - name: BEARCAT_API_URL
              value: "http://{{ include "lt.fullname" . }}-api:8000"
            - name: NGINX_POD_LABEL
              value: "app.kubernetes.io/component=nginx"
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
