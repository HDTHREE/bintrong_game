# -- API Service -------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lt.fullname" . }}-api
  labels:
    {{- include "lt.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "lt.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
# -- App (Dash) Service ------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lt.fullname" . }}-app
  labels:
    {{- include "lt.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
    - port: 7777
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "lt.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
---
# -- nginx Service -----------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lt.fullname" . }}-nginx
  labels:
    {{- include "lt.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
    - port: {{ .Values.nginx.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "lt.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
---
# -- PostgreSQL Service -------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lt.fullname" . }}-postgres
  labels:
    {{- include "lt.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: pg
      protocol: TCP
      name: pg
  selector:
    {{- include "lt.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
{{- if .Values.sglang.enabled }}
---
# -- SGLang Service -----------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lt.fullname" . }}-sglang
  labels:
    {{- include "lt.labels" . | nindent 4 }}
    app.kubernetes.io/component: sglang
spec:
  type: ClusterIP
  ports:
    - port: 30000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "lt.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: sglang
{{- end }}
